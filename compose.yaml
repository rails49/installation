# The installation: the door in front of everything a browser reaches on this
# box, the page listing what the box serves, and the box's own requests and
# status page.
# Nothing here is about a railroad. The door is stock; the page and the box are
# this repository's images, `installation-page` and `installation-box`.
#
#     docker compose --env-file /etc/rails49/box.env up -d --build
#
# `--env-file` is how the box's declaration reaches this file. Compose reads it
# for the labels and for the door's and the page's environment; the door reads
# `acme.env` beside it for the credential, which no other stack is handed.
# README.md is the install.
#
# The project's name, which compose otherwise takes from the directory this
# file sits in — a clone under another name would spell it differently. Said
# here instead, so the containers are `installation-door-1` and stay so.

name: installation

services:
  # The door. Stock Traefik, reading its routers off container labels rather
  # than a route file: a UI's paths then change in the same commit as the UI,
  # and there is no second route table anywhere to disagree with them.
  #
  # `exposedByDefault=false` because the provider sees every container on the
  # box, including ones that are nobody's browser's business — a stack opts in
  # with `traefik.enable=true` on the container the door reaches.
  door:
    # Pinned to a minor that negotiates the Docker API version with the daemon.
    # The provider in v3.3 and v3.4 asks for API 1.24 and takes no answer about
    # it, so a box whose daemon has raised its minimum refuses every call the
    # provider makes: no container is ever read, no router is ever built, and
    # the door serves 404 for every name while its log repeats "client version
    # 1.24 is too old". Docker Engine 29 has a minimum of 1.40, which is the
    # box this was found on. Negotiation arrived after v3.4, so the floor is
    # v3.7 rather than a newer patch of what was here.
    image: traefik:v3.7
    restart: unless-stopped
    # 80 is the page and 8081-8084 are the UI ports, in README's table. On a
    # box with a box name 80 redirects the box name and its labels to 443 (the
    # `to-https` router below): a person types a bare hostname and the
    # browser tries http, so a box that published 443 alone would refuse the
    # connection and the site would read as down. The certificate comes from
    # a DNS-01 challenge, so nothing here needs 80 to reach the outside.
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    # The credential and the ACME account address, whole, from the file the
    # operator wrote. Read by this service and no other.
    #
    # `required: false` because compose refuses to parse a file naming an
    # env_file that is not there, and this one is the box's rather than the
    # repository's: a clone on a dev machine could not be read at all, gate
    # included. A box missing it gets a door that starts and a resolver that
    # cannot, which the door's log says and README.md repeats. A box with no
    # certificate has no resolver and needs no such file.
    env_file:
      - path: /etc/rails49/acme.env
        required: false
    # Read by the script below. `BOX_DOMAIN` empty is a box with no
    # certificate; unset is a door started without the declaration.
    # `BOX_ACME_PROVIDER` is required only with a box name, so the script
    # checks it: compose's own check would refuse it on every box.
    environment:
      BOX_DOMAIN: ${BOX_DOMAIN?start this with --env-file /etc/rails49/box.env}
      BOX_ACME_PROVIDER: ${BOX_ACME_PROVIDER-}
    # Traefik takes its static configuration from flags, a file or the
    # environment and never a mix, so the kind of box is chosen by building
    # the flags here and `exec`ing Traefik with them. `$$` is a `$` compose
    # leaves for the shell.
    #
    # With a box name, the DNS provider is the operator's, because being
    # reachable cannot require the DNS host this project happens to use. The
    # stock binary carries every provider already; which credential it reads
    # is `acme.env`'s business.
    #
    # Before writing the TXT record lego asks which zone the name belongs to,
    # and a consumer router answers that question with SERVFAIL often enough
    # that the resolver cannot be left to whatever the network hands the
    # container. These two are asked instead. A hardcoded default rather than
    # a parameter: an operator who has to name a resolver to get a certificate
    # has been handed somebody else's bug.
    command:
      - /bin/sh
      - -c
      - |
        set -- \
          --providers.docker=true \
          --providers.docker.exposedByDefault=false \
          --entryPoints.web.address=:80 \
          --entryPoints.control.address=:8081 \
          --entryPoints.dccex.address=:8082 \
          --entryPoints.jmri.address=:8083 \
          --entryPoints.occupancy.address=:8084
        if [ -n "$$BOX_DOMAIN" ]; then
          provider=$${BOX_ACME_PROVIDER:?a box with a box name names its DNS provider in /etc/rails49/box.env}
          set -- "$$@" \
            --entryPoints.websecure.address=:443 \
            --certificatesResolvers.le.acme.storage=/acme/acme.json \
            --certificatesResolvers.le.acme.dnsChallenge.provider="$$provider" \
            --certificatesResolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,9.9.9.9:53
        fi
        exec traefik "$$@"
    volumes:
      # Read-only: the provider watches containers and starts none.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    # The redirect on 80 and the origin check are on the door's own labels, so
    # they hold while `page` or `box` is down. With `box` down the check
    # answers 500, and every path behind it is refused.
    labels:
      - traefik.enable=true
      # On 80, the box name and every name under it redirect to HTTPS, `/box`
      # included, so the priority is above `box-http`'s. An address or a
      # `.local` name is not matched and gets the page and `/box` over plain
      # HTTP. `\Q…\E` makes the box name's dots match only dots. On a box with
      # no certificate the rule is `Host(``)`, which the door refuses: it logs
      # an error and drops this router.
      - traefik.http.routers.to-https.rule=Host(`${BOX_DOMAIN}`) || HostRegexp(`^.+\.\Q${BOX_DOMAIN}\E$$`)
      - traefik.http.routers.to-https.priority=200
      - traefik.http.routers.to-https.entrypoints=web
      - traefik.http.routers.to-https.service=noop@internal
      - traefik.http.routers.to-https.middlewares=to-https
      - traefik.http.middlewares.to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.to-https.redirectscheme.permanent=true
      # The origin check every UI puts on its websocket and write paths, on
      # HTTPS and on its UI port, as `same-origin@docker`. The door asks
      # `box`'s `/origin` for each request and passes it on only on a 2xx.
      - traefik.http.middlewares.same-origin.forwardauth.address=http://box:8080/origin
    networks:
      - rails49

  # The page at the apex: one link per label in the declaration, rendered once
  # when this container starts and a static file from then on. Stock nginx with
  # `page/` and `look/` copied in (`page/Dockerfile`); `look/` is served as it
  # is, at `/look/`.
  #
  # Named by the commit it was built from, and the name never moves. `dev` is
  # what a clone that has not been told a commit builds under; `deploy.sh`
  # names the commit, and a release names the image by its digest.
  page:
    image: ghcr.io/rails49/installation-page:${INSTALLATION_COMMIT:-dev}
    build:
      context: .
      dockerfile: page/Dockerfile
      # The same commit to the image's revision label, empty when none is named.
      args:
        INSTALLATION_COMMIT: ${INSTALLATION_COMMIT:-}
    restart: unless-stopped
    environment:
      BOX_DOMAIN: ${BOX_DOMAIN?start this with --env-file /etc/rails49/box.env}
      BOX_UIS: ${BOX_UIS}
    # The box's hostname is the page's title and band on a box with no
    # certificate, and is read once, at start.
    volumes:
      - /etc/hostname:/host/hostname:ro
    # The image's own entrypoint still runs, so this is what it execs: render
    # once, then be nginx. `exec` because nginx is what this container is —
    # a shell holding pid 1 would swallow the signal that stops it.
    command:
      - /bin/sh
      - -c
      - /page/render.sh > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
    labels:
      - traefik.enable=true
      # This container is on two networks and the docker provider otherwise
      # picks whichever address it finds first (ADR-0004).
      - traefik.docker.network=rails49
      - traefik.http.routers.page.rule=Host(`${BOX_DOMAIN}`)
      - traefik.http.routers.page.entrypoints=websecure
      - traefik.http.routers.page.tls.certresolver=le
      # The page over plain HTTP on 80, at any host. The rule is written out
      # because a docker router with none gets `Host(<container name>)`.
      - traefik.http.routers.page-http.rule=PathPrefix(`/`)
      - traefik.http.routers.page-http.entrypoints=web
    networks:
      - rails49

  # The box's own requests: `GET /box` and `POST /box/off`, whether it can be
  # turned off from here and turning it off, which a UI asks and the
  # installation answers (ADR-0005); the status page at `/box/` with what
  # it shows and offers (#65 decisions 5 to 7); and starting an update or
  # going back, which `rails49-update` does from this image outside this
  # project (decision 8). Stock node with `box/`,
  # `look/` and the Docker CLI in it (`box/Dockerfile`), named by its commit
  # as the page is.
  #
  # Privileged and in the box's PID namespace, because turning off is
  # `nsenter` into PID 1 and `systemctl poweroff` there, and the box's address
  # is read in PID 1's network.
  box:
    image: ghcr.io/rails49/installation-box:${INSTALLATION_COMMIT:-dev}
    build:
      context: .
      dockerfile: box/Dockerfile
      args:
        INSTALLATION_COMMIT: ${INSTALLATION_COMMIT:-}
    restart: unless-stopped
    privileged: true
    pid: host
    # `BOX_UIS` says which stacks the box runs (#65 decision 6).
    environment:
      BOX_DOMAIN: ${BOX_DOMAIN?start this with --env-file /etc/rails49/box.env}
      BOX_UIS: ${BOX_UIS}
    # The socket, through which the status page reads the stacks and the
    # update container is started. The box's settings, read only: the log
    # bundle takes `box.env` and each stack's file by name, and never
    # `acme.env`. `/var/lib/rails49`, which holds the releases, the record,
    # the progress of an update and the last check for a new release. The
    # hostname names a box with no certificate, as on the page.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/rails49:/etc/rails49:ro
      - /var/lib/rails49:/var/lib/rails49
      - /etc/hostname:/host/hostname:ro
    command:
      - node
      - /box/server.mjs
    labels:
      - traefik.enable=true
      - traefik.docker.network=rails49
      # No `Host`: the same paths on every name the door serves, which is
      # every origin a UI is served from. Above every label's own router,
      # which otherwise takes `/box` under its name for itself.
      - traefik.http.routers.box.rule=PathPrefix(`/box`)
      - traefik.http.routers.box.priority=100
      - traefik.http.routers.box.entrypoints=websecure
      # No resolver: each name's own router already has its certificate.
      - traefik.http.routers.box.tls=true
      # The same paths over plain HTTP, on the page's port and every UI
      # port. A second router, because one with `tls=true` does not match
      # plain HTTP. On 80 `to-https` outranks it for the box name and its
      # labels.
      - traefik.http.routers.box-http.rule=PathPrefix(`/box`)
      - traefik.http.routers.box-http.priority=100
      - traefik.http.routers.box-http.entrypoints=web,control,dccex,jmri,occupancy
      - traefik.http.services.box.loadbalancer.server.port=8080
    networks:
      - rails49

# The one network every stack on the box shares, created here under a fixed
# name every stack hardcodes. A container joins it if the door reaches it, if
# it dials a service in another stack, or if another stack dials it
# (ADR-0004). `name:` because compose would otherwise prefix it with this
# project's, and the point of this network is that it belongs to no single
# project.
networks:
  rails49:
    name: rails49

volumes:
  acme:
