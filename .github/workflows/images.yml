# installation-page and installation-box at one commit, for a release
# (rails49/.github#71). The release workflow calls this; nothing else runs it.
#
# Each image is built on an amd64 and an arm64 runner, pushed by digest, and
# the two joined under `ghcr.io/rails49/installation-<image>:<commit>`. An
# image already pushed for the commit is not built again. The workflow returns
# each image's digest, and uploads the box files as `installation-box-files`.
name: images

on:
  workflow_call:
    inputs:
      commit:
        description: The commit to build, as a full SHA.
        required: true
        type: string
    outputs:
      installation-page:
        description: The digest of ghcr.io/rails49/installation-page:<commit>.
        value: ${{ jobs.join.outputs.installation-page }}
      installation-box:
        description: The digest of ghcr.io/rails49/installation-box:<commit>.
        value: ${{ jobs.join.outputs.installation-box }}

permissions:
  contents: read
  packages: write

env:
  COMMIT: ${{ inputs.commit }}
  # The services compose.yaml builds. Each is `<image>/Dockerfile`.
  IMAGES: page box

jobs:
  # Which images have no `:<commit>` on GHCR yet. Only an answer that the
  # image is not there, or a read this token is refused, counts as missing;
  # any other error stops the run, and no tag is written.
  pushed:
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.look.outputs.missing }}
    steps:
      - name: Refuse anything but a full commit
        run: |
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $COMMIT" >&2; exit 1; }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: look
        run: |
          missing=()
          for image in $IMAGES; do
            ref=ghcr.io/rails49/installation-$image:$COMMIT
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "$ref is already pushed"
            elif grep -qiE 'not found|unknown|denied|403' <<<"$out"; then
              missing+=("$image")
            else
              echo "$out" >&2
              exit 1
            fi
          done
          echo "missing=$(jq -cn '$ARGS.positional' --args "${missing[@]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: pushed
    if: needs.pushed.outputs.missing != '[]'
    strategy:
      matrix:
        image: ${{ fromJSON(needs.pushed.outputs.missing) }}
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/rails49/installation-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rails49/installation
          ref: ${{ inputs.commit }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          build-args: INSTALLATION_COMMIT=${{ inputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the join
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: installation-digests-${{ matrix.image }}-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  join:
    needs: [pushed, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      installation-page: ${{ steps.join.outputs.installation-page }}
      installation-box: ${{ steps.join.outputs.installation-box }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        if: needs.build.result == 'success'
        with:
          pattern: installation-digests-*
          path: digests
      - id: join
        run: |
          for image in $IMAGES; do
            name=ghcr.io/rails49/installation-$image
            built=$(find digests -path "digests/installation-digests-$image-*" -type f -printf "$name@sha256:%f\n" 2>/dev/null || true)
            if [ -n "$built" ]; then
              # shellcheck disable=SC2086  # one reference per line, no spaces
              docker buildx imagetools create -t "$name:$COMMIT" \
                --annotation "index:org.opencontainers.image.revision=$COMMIT" \
                --annotation "index:org.opencontainers.image.source=https://github.com/rails49/installation" \
                $built
            fi
            digest=$(docker buildx imagetools inspect "$name:$COMMIT" --format '{{json .Manifest}}' | jq -r .digest)
            echo "installation-$image=$digest" >> "$GITHUB_OUTPUT"
            docker buildx imagetools inspect "$name:$COMMIT"
          done

  # The files a box runs this stack from: the compose files, and `jmri/`,
  # which the box builds itself. Nothing else is mounted from the clone.
  box-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: rails49/installation
          ref: ${{ inputs.commit }}
      - uses: actions/upload-artifact@v7
        with:
          name: installation-box-files
          path: |
            compose.yaml
            jmri/
          if-no-files-found: error
