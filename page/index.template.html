<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<script type="module" src="/look/look.bundle.js"></script>
<style>
  /* The page's own: the list and the footer. The band is look's. */
  body {
    margin: 0;
    background: var(--sl-color-neutral-0);
    color: var(--sl-color-neutral-900);
    font-family: var(--sl-font-sans);
    line-height: 1.6;
  }

  main,
  footer {
    margin: 0 auto;
    max-width: 48rem;
    padding: 2rem 1.5rem;
  }

  footer { padding-top: 0; }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li + li { border-top: 1px solid var(--sl-color-neutral-200); }

  li a,
  footer a {
    color: inherit;
    display: block;
    font-size: 1.25rem;
    padding: 1rem 0;
    text-decoration: none;
  }

  li a:hover,
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<look-shell>
<look-band><look-about name="{{NAME}}"></look-about></look-band>
<main>
<ul>
{{LINKS}}
</ul>
</main>
<footer><a href="https://rails49.org/">rails49.org</a></footer>
</look-shell>
<script>
  // On a box with no certificate a link names its UI port, and its host is
  // whatever this page was reached at: an address or `<hostname>.local`.
  for (const a of document.querySelectorAll("a[data-same-host]")) a.hostname = location.hostname;
</script>
</body>
</html>
