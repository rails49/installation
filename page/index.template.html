<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<link rel="stylesheet" href="/look/look.css">
<script type="module" src="/look/look.bundle.js"></script>
<style>
  /* The page's own: the list. The band is look's. */
  body {
    margin: 0;
    background: var(--sl-color-neutral-0);
    color: var(--sl-color-neutral-900);
    font-family: var(--sl-font-sans);
    line-height: 1.4;
  }

  main {
    margin: 0 auto;
    max-width: 48rem;
    padding: 2rem 1.5rem;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .item {
    align-items: center;
    color: inherit;
    column-gap: 1rem;
    display: grid;
    grid-template-columns: 1.75rem 1fr;
    padding: 1rem 0;
    text-decoration: none;
  }

  .item svg {
    grid-row: span 2;
    height: 1.75rem;
    width: 1.75rem;
  }

  .name { font-size: 1.25rem; }

  .text { color: var(--sl-color-neutral-600); }

  a.item:hover .name { text-decoration: underline; }
</style>
</head>
<body>
<look-shell>
<look-band><look-about name="{{NAME}}"></look-about></look-band>
<main>
<ul>
{{LINKS}}
{{ALWAYS}}
</ul>
</main>
</look-shell>
<script>
  // Over plain HTTP a link goes to its UI port at whatever host this page was
  // reached at: an address or `<hostname>.local`. Over HTTPS it keeps its
  // label under the box name.
  if (location.protocol !== "https:") {
    for (const a of document.querySelectorAll("a[data-ui-port]")) {
      a.href = `http://${location.hostname}:${a.dataset.uiPort}`;
    }
  }
</script>
</body>
</html>
