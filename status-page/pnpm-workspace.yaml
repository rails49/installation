# The dependencies whose install scripts pnpm runs. pnpm 11 runs only those
# named here, and stops the install with an error at any other that has one,
# so without this setting the image build fails (#58).
#
# `esbuild` is `vite`'s, and its postinstall is what puts the platform binary
# in place. It is named here and not under `pnpm` in `package.json`, which
# pnpm 10 and later do not read this from.
allowBuilds:
  esbuild: true
