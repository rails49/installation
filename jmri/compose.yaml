# JMRI: the one UI no repository of this project owns, riding here as an
# optional extra. It is **not** part of the installation, which is why it is a
# compose project of its own rather than a profile on the installation's
# (ADR-0002) — started and stopped with its own `-f`, touching neither the door
# nor the page.
#
#     (. /etc/rails49/deploy.env && mkdir -p "$TC49_STORE/jmri")
#     TC49_UID=$(id -u) TC49_GID=$(id -g) docker compose \
#       --env-file /etc/rails49/box.env --env-file /etc/rails49/deploy.env \
#       -f jmri/compose.yaml up -d --build
#
# The installation runs first: this file joins the network that one creates,
# and compose says so plainly if it is not there. `control` runs first too: it
# writes `TC49_STORE`, the root of its store, to `/etc/rails49/deploy.env`.

name: jmri

services:
  jmri:
    # The stock image with its user renumbered to the person, so the files it
    # writes in the store are theirs (Dockerfile, rails49/.github ADR-0013).
    build:
      context: .
      args:
        TC49_UID: "${TC49_UID:-1000}"
        TC49_GID: "${TC49_GID:-1000}"
    restart: unless-stopped
    # A fresh /tmp on every start. The image's websockify dials
    # `localhost:5901` while its `vncserver` takes the first display that has
    # no socket in /tmp/.X11-unix, and `docker restart` keeps the writable
    # layer — so each restart leaks a socket, burns a display, and moves the
    # VNC server one port away from the one noVNC connects to. The entrypoint
    # is upstream's and stays untouched; this makes the leak impossible
    # instead.
    tmpfs:
      - /tmp
    # JMRI's profile, the click that points it at the command station and the
    # roster with every loco's CVs, lives in `control`'s store and is backed up
    # with it (rails49/.github ADR-0013). Mounted outside /home/jmri, which the
    # image's entrypoint makes world-writable on every start, and never made
    # here: docker would make a missing directory owned by root, which neither
    # JMRI nor the store can write. The rest of the home is the volume, and
    # losing it costs nothing. The image does not start JMRI: a person clicks
    # DecoderPro through noVNC.
    #
    # The root is `control`'s and has no default here, which would be a second
    # answer to where the store is. Started without `deploy.env`, compose warns
    # that `TC49_STORE` is not set and refuses to bind the `/jmri` that leaves.
    environment:
      JMRI_OPTIONS: -Dorg.jmri.profile=/profile
    volumes:
      - jmri:/home/jmri
      - type: bind
        source: ${TC49_STORE}/jmri
        target: /profile
        bind:
          create_host_path: false
    # **No port is published.** 6901 is noVNC and goes behind the door, which
    # is one door per box (ADR-0004) applied to the last thing on this box that
    # contradicted it. 12080 is JMRI's own web server: a browser reaches it, so
    # it is behind the door or it is nowhere, and it is nowhere until someone
    # wants it — at which point it earns a label of its own. 5901 is raw VNC,
    # which is not a browser's, and anyone who wants it has ssh.
    labels:
      - traefik.enable=true
      # This container is on two networks and the docker provider otherwise
      # picks whichever address it finds first (ADR-0004).
      - traefik.docker.network=rails49
      - traefik.http.routers.jmri.rule=Host(`jmri.${BOX_DOMAIN:?start this with --env-file /etc/rails49/box.env}`)
      - traefik.http.routers.jmri.entrypoints=websecure
      - traefik.http.routers.jmri.tls.certresolver=le
      # Named, because the image exposes three ports and the door would
      # otherwise pick one of them for us.
      - traefik.http.services.jmri.loadbalancer.server.port=6901
    networks:
      - rails49

# The installation's, created by its compose under a fixed name every stack
# hardcodes (ADR-0004). A box that starts this before the installation is told
# so: "network rails49 declared as external, but could not be found".
networks:
  rails49:
    external: true

volumes:
  jmri:
